name: Build APK + AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Project layout. The source must sit at the repository ROOT: settings.gradle, app/ and tools/ next to .github/.
      # Run #7 failed here: the repository held only DocScanner.zip (never extracted), so tools/verify/ did not exist.
      # If the zip is there and the project is not, unpack it for this build (and say so); otherwise stop with a clear message.
      # Without this check the licence guard below would have PASSED on a missing folder (grep exits 2, not 0).
      - name: Locate the project (unpack DocScanner.zip if needed)
        run: |
          if [ ! -f settings.gradle ]; then
            if [ -f DocScanner.zip ]; then
              echo "::warning::The repository contains DocScanner.zip instead of the extracted project - unpacking it for this build. Better: extract the zip and commit its contents so settings.gradle, app/ and tools/ are at the repository root."
              rm -rf _unzipped
              unzip -q DocScanner.zip -d _unzipped
              top=$(find _unzipped -maxdepth 3 -name settings.gradle -printf '%h\n' | head -n 1)
              if [ -z "$top" ]; then
                echo "::error::DocScanner.zip does not contain settings.gradle (is it the right zip?)."
                exit 1
              fi
              rm -rf "$top/.github"   # the workflow that is running now stays the one from the repository
              cp -R "$top"/. .
              rm -rf _unzipped
            else
              echo "::error::settings.gradle not found at the repository root and there is no DocScanner.zip to unpack. Extract DocScanner.zip and commit its contents (app/, tools/, build.gradle, settings.gradle, ...) next to .github/."
              exit 1
            fi
          fi
          for p in settings.gradle build.gradle gradle.properties app tools/verify/doc_sync_check.py; do
            if [ ! -e "$p" ]; then
              echo "::error::Project layout incomplete: '$p' is missing at the repository root."
              exit 1
            fi
          done
          echo "Project found:"; ls

      # ---- Licence guard: this app is sold on Google Play, so nothing AGPL/GPL-style may creep back in.
      # iText (com.itextpdf, AGPL / paid commercial) and MuPDF (com.artifex, AGPL / paid commercial)
      # were the two realistic traps. See TECHNICAL_DOCS.md, phien 11.
      # grep exit codes: 0 = found (forbidden), 1 = nothing found (good), >=2 = grep itself failed (must not pass silently).
      - name: Licence guard (source)
        run: |
          set +e
          grep -rIn -E "com\.itextpdf|itextsupport|com\.artifex|mupdf" \
               --include=*.gradle --include=*.kt --include=*.xml --include=*.pro --include=*.properties \
               app settings.gradle build.gradle gradle.properties
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::A forbidden (AGPL / paid-licence) PDF library is referenced. See TECHNICAL_DOCS.md phien 11."
            exit 1
          elif [ "$rc" -ne 1 ]; then
            echo "::error::The licence guard could not run (grep exit code $rc)."
            exit 1
          fi

      # Documentation must match the code (file map, version table, constants table, tools/verify list).
      - name: Docs sync check
        run: python3 tools/verify/doc_sync_check.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # AGP 8.13 needs Gradle 8.13+ (AGP 8.11/8.12 minimum is 8.13 per the Android docs).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Install SDK platform 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Licence guard (resolved dependency tree)
        run: |
          gradle :app:dependencies --configuration releaseRuntimeClasspath --console=plain > dependencies.txt
          if grep -i -E "itextpdf|artifex|mupdf" dependencies.txt; then
            echo "::error::A forbidden library is in the resolved dependency tree."
            exit 1
          fi

      - name: Decode upload keystore (only if secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret - the AAB will be unsigned (fine for testing, NOT uploadable)."
          fi

      - name: Build debug APK
        env:
          APP_ID: ${{ vars.APP_ID }}
        run: gradle assembleDebug --stacktrace

      - name: Build release AAB (only with a real application id)
        env:
          APP_ID: ${{ vars.APP_ID }}
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          case "$APP_ID" in
            ""|com.example*)
              echo "::warning::Repository variable APP_ID is empty or starts with com.example - Google Play rejects that. Skipping the release AAB."
              exit 0 ;;
          esac
          gradle bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: docscanner-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: docscanner-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - name: Upload dependency list (for the licences screen / audits)
        uses: actions/upload-artifact@v4
        with:
          name: dependencies
          path: dependencies.txt
